# Render Blueprint - backend AI UGC STUDIO (plan free, sin tarjeta).
# Conectar en dashboard: New Blueprint Instance -> este repo.
services:
  - type: web
    name: ai-ugc-studio-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r app/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PROFILE
        value: LOW_RAM_12GB
      - key: CLOUD_INFERENCE_MODE
        value: kaggle
      - key: CLOUD_WORKER_KEY
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: HF_TOKEN
        sync: false
      - key: HF_REPO
        sync: false
      - key: HF_REPO_TYPE
        value: model
      - key: FISH_AUDIO_API_KEY
        sync: false
      - key: FISH_AUDIO_REFERENCE_ID
        sync: false
